name: Update workshops feed

# Weekly check of hosts' public schedule pages (see scripts/update-workshops.mjs
# for the source list). If the scraped feed changed, the data file is committed
# and a site deploy is dispatched — pushes made with GITHUB_TOKEN do not fire
# push-triggered workflows on their own.

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC — keeps dates and spots-left fresh
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-workshops
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-c5222r
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser for widget rendering
        working-directory: scripts
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Scrape host schedules
        run: node scripts/update-workshops.mjs
      - name: Commit and deploy if the feed changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/src/data/live-workshops.json; then
            echo "No changes in the workshops feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/live-workshops.json
          git commit -m "Update live workshops feed (weekly check)"
          # The branch may have moved while the scrape ran — replay on top.
          git pull --rebase origin claude/new-session-c5222r
          git push
          gh workflow run deploy.yml --ref claude/new-session-c5222r
