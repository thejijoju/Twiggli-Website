name: Update workshops feed

# Weekly check of hosts' public schedule pages (see scripts/update-workshops.mjs
# for the source list). If the scraped feed changed, the data file is committed
# and a site deploy is dispatched — pushes made with GITHUB_TOKEN do not fire
# push-triggered workflows on their own.

on:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC — keeps hosting cost down
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-workshops
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-c5222r
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser for widget rendering
        working-directory: scripts
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Scrape host schedules
        run: node scripts/update-workshops.mjs
      # Sessions that were sold out last time and are bookable again: open
      # an issue so the site owner (who holds the "🔔 Notify me" mails) can
      # tell subscribers the event is open — with the inbox search line and
      # a ready-to-send reply per event.
      - name: Open a notify-subscribers issue for reopened events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reopened-events.json','utf8')).length)" 2>/dev/null || echo 0)
          echo "Reopened events: $count"
          if [ "$count" = "0" ]; then exit 0; fi
          node - > issue-body.md <<'EOF'
          const events = JSON.parse(require('fs').readFileSync('reopened-events.json', 'utf8'));
          const lines = [
            'These sessions were sold out on the previous scrape and are **open for bookings again**.',
            '',
            'For each one: search your inbox for the subject line below (every "Notify me" request carries it) and reply to those people with the ready-made text.',
            '',
          ];
          for (const w of events) {
            const when = `${w.date}${w.time ? ` ${w.time}` : ''}`;
            const anchor = `live-${w.slug}-${w.date}-${w.time ?? 'tba'}`;
            const link = `https://www.twiggli.com/happening-today/#${anchor}`;
            lines.push(`### ${w.title} — ${when}`);
            lines.push(`- Inbox search: \`Notify me: ${w.title} on ${w.date}\``);
            lines.push(`- Ready to send:`);
            lines.push(`  > Good news — "${w.title}" on ${when} just opened up for bookings again. Book it here before it fills up: ${link}`);
            lines.push('');
          }
          console.log(lines.join('\n'));
          EOF
          gh issue create --title "🔔 ${count} reopened event(s) — notify subscribers" --body-file issue-body.md
      - name: Commit and deploy if the feed changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/src/data/live-workshops.json; then
            echo "No changes in the workshops feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/live-workshops.json
          git commit -m "Update live workshops feed (weekly check)"
          # The branch may have moved while the scrape ran — replay on top.
          git pull --rebase origin claude/new-session-c5222r
          git push
          gh workflow run deploy.yml --ref claude/new-session-c5222r
