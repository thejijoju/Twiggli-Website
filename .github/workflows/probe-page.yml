name: Probe a page

# On-demand helper: fetches a URL from the Actions runner (which has open
# internet, unlike some development sandboxes) and prints the page's
# headings and visible text to the log. Read-only; touches nothing.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch and describe'
        required: true
        type: string
      marker:
        description: 'Optional text to find — prints raw HTML around each match, for reading structure a parser needs'
        required: false
        type: string

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and describe
        run: |
          node - <<'EOF'
          const url = process.env.PROBE_URL;
          const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; TwiggliScheduleBot/1.0; +https://www.twiggli.com)' }, redirect: 'follow' });
          const html = await res.text();
          console.log(`HTTP ${res.status}, ${html.length} bytes\n`);
          const decode = (s) => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&nbsp;/g,' ');
          const strip = (s) => decode(s.replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi,' ').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();
          console.log('--- json-ld ---');
          for (const m of html.matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)) console.log(m[1].slice(0, 4000));
          console.log('\n--- headings ---');
          for (const m of html.matchAll(/<h([1-4])[^>]*>([\s\S]*?)<\/h\1>/gi)) {
            const t = strip(m[2]);
            if (t) console.log(`h${m[1]}: ${t}`);
          }
          console.log('\n--- links to /events or products ---');
          for (const m of new Set([...html.matchAll(/href="([^"]*(?:event|product|workshop|kurs)[^"]*)"/gi)].map(x => x[1]))) console.log(m);
          console.log('\n--- scheduling-ish urls anywhere in the page ---');
          for (const m of new Set([...html.matchAll(/https?:\/\/[^\s"'<>\\]*(?:acuity|schedul|calendly|bookwhen|regiondo|eventfrog|eversports)[^\s"'<>\\]*/gi)].map(x => x[0]))) console.log(m);
          console.log('\n--- 24-hex ids in context (booking-app config) ---');
          for (const m of [...html.matchAll(/\b[0-9a-f]{24}\b/g)].slice(0, 30)) {
            console.log(`@${m.index}: …${html.slice(Math.max(0, m.index - 120), m.index + 40).replace(/\s+/g, ' ')}…`);
          }
          console.log('\n--- all hrefs (first 100, deduped) ---');
          [...new Set([...html.matchAll(/href="([^"]+)"/gi)].map(x => x[1]))].slice(0, 100).forEach(u => console.log(u));
          console.log('\n--- visible text (first 12000 chars) ---');
          console.log(strip(html).slice(0, 12000));
          const marker = process.env.PROBE_MARKER;
          if (marker) {
            console.log(`\n--- raw HTML around "${marker}" ---`);
            let i = 0, n = 0;
            while (n < 8) {
              const idx = html.indexOf(marker, i);
              if (idx < 0) break;
              console.log(`@${idx}:\n${html.slice(Math.max(0, idx - 400), idx + 1200)}\n---`);
              i = idx + marker.length;
              n++;
            }
            if (!n) console.log('(no match)');
          }
          EOF
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_MARKER: ${{ inputs.marker }}
