name: Fetch assets

# On-demand helper: downloads files from the open internet on the Actions
# runner (development sandboxes cannot reach most hosts' sites) and commits
# them into the repository — photos a host has published for a page we are
# building, say. Each line of `files` is "URL -> path/in/repo". Nothing is
# overwritten unless `overwrite` is set, and only images are accepted.

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'One "URL -> repo/path.jpg" per line (or separated by ";")'
        required: true
        type: string
      overwrite:
        description: 'Replace files that already exist'
        required: false
        type: boolean
        default: false
      resize:
        description: 'Optional longest side in px: big photos are shrunk to it (JPEG, quality 82) before they are committed'
        required: false
        type: string
        default: ''
      video_mode:
        description: 'Videos instead of images: "sheet" (contact sheets to tmp-video/) or "encode" (site/public/video/<name>.mp4 + -poster.jpg); lines are then "URL or Drive id -> name"'
        required: false
        type: string
        default: ''
      video_start:
        description: 'encode: start second'
        required: false
        type: string
        default: ''
      video_length:
        description: 'encode: length in seconds'
        required: false
        type: string
        default: ''
      video_poster_at:
        description: 'encode: poster frame second, from the cut start'
        required: false
        type: string
        default: '1'

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download
        if: inputs.video_mode == ''
        env:
          FILES: ${{ inputs.files }}
          OVERWRITE: ${{ inputs.overwrite }}
          RESIZE: ${{ inputs.resize }}
        run: |
          fetched=0
          if [ -n "$RESIZE" ] && ! command -v convert >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null; fi
          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            url="${line%% -> *}"; dest="${line##* -> }"
            if [ "$url" = "$line" ] || [ -z "$dest" ]; then echo "SKIP (no ' -> '): $line"; continue; fi
            case "$dest" in /*|*..*) echo "SKIP (unsafe path): $dest"; continue;; esac
            if [ -e "$dest" ] && [ "$OVERWRITE" != "true" ]; then echo "SKIP (exists): $dest"; continue; fi
            mkdir -p "$(dirname "$dest")"
            tmp="$(mktemp)"
            code=$(curl -sSL -m 60 -A 'Mozilla/5.0 (compatible; TwiggliAssetBot/1.0; +https://www.twiggli.com)' -o "$tmp" -w '%{http_code} %{content_type}' "$url" || echo "000 -")
            type="${code#* }"
            if [ "${code%% *}" != "200" ] || [ "${type#image/}" = "$type" ]; then
              echo "FAILED ($code): $url"; rm -f "$tmp"; continue
            fi
            if [ -n "$RESIZE" ]; then convert "$tmp" -auto-orient -resize "${RESIZE}x${RESIZE}>" -strip -quality 82 "jpg:$tmp"; fi
            mv "$tmp" "$dest"; fetched=$((fetched + 1))
            echo "OK $(stat -c %s "$dest") bytes ($type): $url -> $dest"
          done < <(printf '%s\n' "$FILES" | tr ';' '\n')
          echo "fetched=$fetched" >> "$GITHUB_ENV"
      - name: Download and process videos
        if: inputs.video_mode != ''
        env:
          VIDEOS: ${{ inputs.files }}
          MODE: ${{ inputs.video_mode }}
          START: ${{ inputs.video_start }}
          LENGTH: ${{ inputs.video_length }}
          POSTER_AT: ${{ inputs.video_poster_at }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          done=0
          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            url="${line%% -> *}"; name="${line##* -> }"
            case "$name" in */*|*..*|"") echo "SKIP (bad name): $name"; continue;; esac
            id="$(echo "$url" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p')"
            [ -z "$id" ] && echo "$url" | grep -qE '^[A-Za-z0-9_-]{20,}$' && id="$url"
            [ -n "$id" ] && url="https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            src="$(mktemp)"
            code=$(curl -sSL -m 300 -o "$src" -w '%{http_code}' "$url" || echo 000)
            if [ "$code" != "200" ] || ! ffprobe -v error -show_entries format=duration -of csv=p=0 "$src" >/dev/null 2>&1; then
              echo "FAILED ($code, $(stat -c %s "$src") bytes, $(file -b "$src" | cut -c1-60)): $name"; rm -f "$src"; continue
            fi
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
            echo "OK $(stat -c %s "$src") bytes, ${dur}s: $name"
            if [ "$MODE" = "encode" ]; then
              mkdir -p site/public/video
              cut=(); [ -n "$START" ] && cut+=(-ss "$START"); [ -n "$LENGTH" ] && cut+=(-t "$LENGTH")
              ffmpeg -v error -y "${cut[@]}" -i "$src" -an -vf "scale=540:-2" -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p -movflags +faststart "site/public/video/$name.mp4" || { echo "  encode FAILED: $name"; rm -f "$src"; continue; }
              ffmpeg -v error -y -ss "${POSTER_AT:-1}" -i "site/public/video/$name.mp4" -frames:v 1 -q:v 4 "site/public/video/$name-poster.jpg"
              echo "  -> site/public/video/$name.mp4 ($(stat -c %s "site/public/video/$name.mp4") bytes)"
            else
              mkdir -p "tmp-video/$name"
              # One small frame per second, to look through and pick a cut.
              ffmpeg -v error -y -i "$src" -vf "fps=1,scale=240:-2" -q:v 6 "tmp-video/$name/%02d.jpg" || echo "  frames FAILED: $name"
              echo "  -> tmp-video/$name/ ($(ls "tmp-video/$name" | wc -l) frames)"
            fi
            rm -f "$src"; done=$((done + 1))
          done < <(printf '%s\n' "$VIDEOS" | tr ';' '\n')
          echo "fetched=$done" >> "$GITHUB_ENV"
      - name: Commit
        if: env.fetched != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Fetch ${fetched} asset(s)${{ inputs.video_mode && format(' (video {0})', inputs.video_mode) || '' }}" -m "Downloaded by the fetch-assets workflow."
          git push origin HEAD:${{ github.ref_name }}
