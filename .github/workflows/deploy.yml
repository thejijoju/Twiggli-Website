name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/new-session-c5222r]
    paths: [site/**, .github/workflows/deploy.yml]
  schedule:
    # Daily rebuild: the schedule pages bake "today" in at build time (day
    # offsets, the happening-today strip), so a fresh build every morning
    # keeps real workshop dates true between weekly feed checks.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed translations back
    steps:
      - uses: actions/checkout@v4
      # What hosts changed in their Twiggli account (texts, weekly schedule),
      # laid over the site's own copy at build time. Never fails the deploy.
      - name: Fetch host account edits
        continue-on-error: true
        run: node scripts/fetch-host-edits.mjs
      # French, Spanish, Italian, Dutch, Polish and Turkish host copy is
      # translated from the English in content.ts: only hosts whose English
      # changed since the last run (scripts/translate-hosts.mjs). Skipped
      # without the ANTHROPIC_API_KEY secret, and never fails the deploy;
      # a host not yet translated falls back to English on the site.
      - name: Translate changed host copy
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo 'No ANTHROPIC_API_KEY secret, skipping'; exit 0; fi
          npm ci --prefix site --no-audit --no-fund
          npm install --no-save --no-audit --no-fund --prefix scripts @anthropic-ai/sdk
          node scripts/translate-hosts.mjs
          git add site/src/data/hosts/*.ts site/src/data/hosts/translation-state.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Translate changed host copy'
            git push
          fi
      - uses: withastro/action@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # IndexNow: tell Bing (and through it Ecosia and DuckDuckGo, which matter
  # in Germany) which URLs changed, the moment the site is live. Google does
  # not take IndexNow; it reads the sitemap. Best effort — a failure here
  # never fails a deploy. The key file lives in site/public/.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    continue-on-error: true
    steps:
      - name: Submit every sitemap URL to IndexNow
        env:
          KEY: a701ea78c46d8fe0338c5fbeb7c1de82
        run: |
          curl -sS https://www.twiggli.com/sitemap-0.xml \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          # Pages taken down, so search engines recrawl them, find them gone
          # and drop them (Mijita, removed at the host's request on 11 Oct;
          # Tessia and Cèlia, taken off on 18 Oct until they agree to be listed;
          # Sümer of Haki Ceramics, archived on 19 Oct while she is fully booked).
          for l in "" de/ fr/ es/ it/ nl/ pl/ tr/; do
            echo "https://www.twiggli.com/${l}workshops/craft/mijita/" >> urls.txt
            for p in "" wax-carving-ring-workshop-halber-tag/ sandguss-wax-carving-workshop-ganzer-tag/; do
              echo "https://www.twiggli.com/${l}workshops/craft/tessia/${p}" >> urls.txt
            done
            for p in "" knit-club/ knitting-course-the-jumper/ knitting-course-beanie-edition/; do
              echo "https://www.twiggli.com/${l}workshops/craft/celia/${p}" >> urls.txt
            done
            for p in "" handbuilding-workshop/ offener-platz-an-der-drehscheibe-fortgeschrittene/; do
              echo "https://www.twiggli.com/${l}workshops/ceramics/haki/${p}" >> urls.txt
            done
          done
          echo "$(wc -l < urls.txt) urls"
          jq -n --arg host www.twiggli.com --arg key "$KEY" \
            --arg keyLocation "https://www.twiggli.com/$KEY.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > body.json
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @body.json -w '\nIndexNow HTTP %{http_code}\n'
