name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/new-session-c5222r]
    paths: [site/**, .github/workflows/deploy.yml]
  schedule:
    # Daily rebuild: the schedule pages bake "today" in at build time (day
    # offsets, the happening-today strip), so a fresh build every morning
    # keeps real workshop dates true between weekly feed checks.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
